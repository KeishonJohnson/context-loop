[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-loop"
version = "0.3.0"
description = "Bounded Codex execution loops with persistent goals and independent acceptance checks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = ["Programming Language :: Python :: 3", "Operating System :: MacOS", "Operating System :: POSIX :: Linux"]

[project.scripts]
context-loop = "context_loop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

